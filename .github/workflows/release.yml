name: Prepare plugin release

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify tag matches plugin version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check:release -- "$RELEASE_TAG"
      - run: npm run release:prepare
      - name: Create draft with installable assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          dist/main.js dist/manifest.json dist/styles.css
